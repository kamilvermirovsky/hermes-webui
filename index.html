<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hermes WebUI - presmerovani</title>
<style>
 body{background:#1a1a2e;color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      height:100vh;display:flex;align-items:center;justify-content:center;margin:0;text-align:center}
 .box{max-width:560px;padding:24px} a{color:#8ab4ff}
</style>
</head><body>
<div class="box">
  <h2>Hermes WebUI</h2>
  <p id="msg">Nacitam aktualni adresu...</p>
  <p><a id="link" href="#">Otevrit rucne</a></p>
</div>
<script>
(async () => {
  const msg = document.getElementById('msg');
  const link = document.getElementById('link');
  try {
    const r = await fetch('target.json?ts=' + Date.now(), {cache: 'no-store'});
    const j = await r.json();
    if (j && j.url) {
      link.href = j.url;
      msg.textContent = 'Presmerovavam...';
      location.replace(j.url);
      return;
    }
    throw new Error('no url');
  } catch (e) {
    msg.textContent = 'Nepodarilo se nacist aktualni adresu. Zkuste obnovit stranku.';
  }
})();
</script>
</body></html>
